# fly.toml app configuration file generated for mieux-api on 2026-11-01T15:06:52+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mieux-api'
primary_region = 'cdg'

[build]
[env]
  ALLOWED_ORIGINS = 'https://mieuxmanger.vercel.app,https://mieux.app'

[[mounts]]
  source = 'mieux_data'
  destination = '/data'

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

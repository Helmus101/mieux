name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: sqlite:///./foodiq.db
        JWT_SECRET_KEY: ci-test-secret-not-used-in-production
      run: |
        python -m pytest
    
    - name: Check migrations
      working-directory: ./backend
      env:
        DATABASE_URL: sqlite:///./foodiq.db
      run: |
        alembic check

  web:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install
      working-directory: ./web
      run: npm ci
    - name: Type-check, test and build
      working-directory: ./web
      run: |
        npx tsc --noEmit
        npx vitest run
        npm run build

  mobile:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install
      working-directory: ./mobile
      run: npm install --no-audit --no-fund
    - name: Type-check
      working-directory: ./mobile
      run: npx tsc --noEmit
